name: Build Linux i386 (v0.76.5)

on:
  workflow_dispatch:

jobs:
  build-i386:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.76.5
        uses: actions/checkout@v4
        with:
          ref: v0.76.5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install 32-bit C toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Show toolchain info
        run: |
          go version
          gcc -v 2>&1 | tail -1
          go env GOOS GOARCH

      - name: Generate embedded assets (fileb0x)
        run: |
          go install github.com/UnnoTed/fileb0x@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          which fileb0x
          fileb0x artifacts/b0x.yaml
          fileb0x config/b0x.yaml
          fileb0x crypto/b0x.yaml
          [ -f gui/velociraptor/b0x.yaml ] && fileb0x gui/velociraptor/b0x.yaml || true

      - name: Build velociraptor for linux/386
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: "386"
          CC: "gcc -m32"
        run: |
          mkdir -p output
          TIMESTAMP=$(date -u +%FT%TZ)
          go build \
            -tags 'server_vql extras release' \
            -ldflags "-s -w -X www.velocidex.com/golang/velociraptor/config.build_time=${TIMESTAMP}" \
            -o output/velociraptor-v0.76.5-linux-386 \
            ./bin
          file output/velociraptor-v0.76.5-linux-386
          ls -lh output/

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: velociraptor-v0.76.5-linux-386
          path: output/velociraptor-v0.76.5-linux-386
          retention-days: 30