name: Build Linux i386 (master, via Mage)

on:
  workflow_dispatch:

jobs:
  build-i386:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Mage
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Show available mage targets
        run: mage -l

      - name: Build linux/386 (Linux386 target)
        run: mage -v Linux386

      - name: List output
        run: |
          ls -lh output/
          file output/velociraptor-* || true

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: velociraptor-linux-386
          path: output/velociraptor-*-linux-386*
          retention-days: 30