name: Build Linux i386 (master)

on:
  workflow_dispatch:

jobs:
  build-i386:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Record commit SHA
        id: sha
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Building from commit: ${SHORT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install 32-bit C toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Build GUI assets (React/webpack bundle)
        working-directory: gui/velociraptor
        run: |
          npm install --legacy-peer-deps
          npm run build || (cat package.json | head -50 && exit 1)
          ls -la build/ || echo "No build directory!"

      - name: Inspect b0x configs
        run: |
          echo "=== artifacts/b0x.yaml ==="
          cat artifacts/b0x.yaml | head -30
          echo "=== config/b0x.yaml ==="
          cat config/b0x.yaml | head -30
          echo "=== crypto/b0x.yaml ==="
          cat crypto/b0x.yaml | head -30
          echo "=== gui/velociraptor/b0x.yaml ==="
          cat gui/velociraptor/b0x.yaml | head -30

      - name: Generate embedded assets (fileb0x)
        run: |
          go install github.com/UnnoTed/fileb0x@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          which fileb0x
          fileb0x artifacts/b0x.yaml
          fileb0x config/b0x.yaml
          fileb0x crypto/b0x.yaml
          fileb0x gui/velociraptor/b0x.yaml
          echo "=== Generated files ==="
          find . -name "ab0x.go" -o -name "*assets*.go" 2>/dev/null | head -30

      - name: Build velociraptor for linux/386
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: "386"
          CC: "gcc -m32"
        run: |
          mkdir -p output
          TIMESTAMP=$(date -u +%FT%TZ)
          COMMIT="${{ steps.sha.outputs.short }}"
          go build \
            -tags 'server_vql extras release' \
            -ldflags "-s -w \
              -X www.velocidex.com/golang/velociraptor/config.build_time=${TIMESTAMP} \
              -X www.velocidex.com/golang/velociraptor/config.commit_hash=${COMMIT}" \
            -o output/velociraptor-master-${COMMIT}-linux-386 \
            ./bin
          file output/velociraptor-master-${COMMIT}-linux-386
          ls -lh output/

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: velociraptor-master-${{ steps.sha.outputs.short }}-linux-386
          path: output/velociraptor-master-${{ steps.sha.outputs.short }}-linux-386
          retention-days: 30